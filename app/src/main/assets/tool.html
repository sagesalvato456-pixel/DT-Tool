:root{
  --fcfont:FCNEO;
  --bg:#141318;--panel:#1c1b22;--panel2:#24232c;--line:#33323d;--txt:#e9e7f0;--dim:#9c99ab;--acc:#b48cff;--acc2:#ff7eb6;
  --r:8px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:12.5px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;overflow:hidden}
button,select,input,textarea{font:inherit;color:inherit}
header.oldhdr{height:52px;display:flex;align-items:center;gap:8px;padding:0 12px;border-bottom:1px solid var(--line);background:#18171d}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:10px;white-space:nowrap}
.brand .logo{font-family:FCNEO;font-size:22px;letter-spacing:1px;background:linear-gradient(90deg,#ff7eb6,#b48cff 45%,#7fd6ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{color:var(--dim);font-size:12px}
.spacer{flex:1}
.btn,button{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.btn:hover,button:hover{border-color:#4a4857;background:#2b2a35}
button.primary{background:linear-gradient(180deg,#9b6dff,#7d4ff0);border-color:#9b6dff;color:#fff}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent;border-color:transparent;padding:3px 6px;color:var(--dim)}
button.ghost:hover{color:var(--txt);background:#2b2a35}
button:disabled{opacity:.4;cursor:default}
select{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 6px}
main{display:flex;height:calc(100% - 52px)}
aside{width:290px;flex:none;overflow-y:auto;background:var(--panel);border-right:1px solid var(--line)}
aside#right{width:320px;border-right:none;border-left:1px solid var(--line)}
aside::-webkit-scrollbar{width:9px}aside::-webkit-scrollbar-thumb{background:#34333e;border-radius:5px}
.panel{border-bottom:1px solid var(--line);padding:10px 12px}
.panel h3{margin:0 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);display:flex;align-items:center;gap:6px}
.panel h3 .grow{flex:1}
#stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background:radial-gradient(circle at 50% 40%,#22212a,#121116)}
#frame{position:absolute;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#view{display:block;width:100%;height:100%;
  background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);
  background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
#ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible;touch-action:none}
#ov .h{cursor:grab}
#tools{position:absolute;left:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:3px;background:#1c1b22f2;border:1px solid var(--line);border-radius:10px;padding:5px;z-index:6}
#tools .tbtn{width:38px;height:38px;padding:0;display:flex;align-items:center;justify-content:center;position:relative;border-radius:7px;background:transparent;border:1px solid transparent;color:#cfcbe0}
#tools .tbtn:hover{background:#2b2a35}
#tools .tbtn.act{background:#3a2c58;border-color:var(--acc);color:#fff}
#tools .tbtn svg{width:20px;height:20px}
#tools .tbtn .tri{position:absolute;right:3px;bottom:3px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid #9c99ab}
#tools .tsep{height:1px;background:var(--line);margin:2px 3px}
#flyout{position:fixed;z-index:20;background:#1f1e26;border:1px solid #45435a;border-radius:9px;padding:4px;box-shadow:0 10px 30px #000a;display:none;min-width:250px}
#flyout.on{display:block}
#flyout .fi{display:grid;grid-template-columns:24px 1fr auto;align-items:center;gap:8px;padding:6px 9px;border-radius:6px;cursor:pointer;color:#e3e0ee;font-size:12.5px}
#flyout .fi:hover{background:#2f2a44}
#flyout .fi.on{background:#3a2c58}
#flyout .fi svg{width:18px;height:18px}
#flyout .fi kbd{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}
#zoomBar{position:absolute;left:10px;bottom:10px;display:flex;align-items:center;gap:2px;background:#1c1b22f0;border:1px solid var(--line);border-radius:8px;padding:3px;z-index:6}
#zoomBar button{padding:3px 8px;font-size:12px;background:transparent;border-color:transparent}
#zoomBar button:hover{background:#2b2a35}
#zoomBar #zPct{min-width:52px;text-align:center;font-variant-numeric:tabular-nums;color:#e3e0ee;font-size:12px}
#tbHint{color:var(--dim);font-size:11.5px;max-width:420px;overflow:hidden;text-overflow:ellipsis}
/* layers */
#layerList{display:flex;flex-direction:column;gap:3px}
.lrow{display:flex;align-items:center;gap:6px;padding:5px 6px;border-radius:6px;background:var(--panel2);border:1px solid transparent;cursor:pointer}
.lrow.sel{border-color:var(--acc);background:#2c2638}
.lrow .sw{width:26px;height:18px;border-radius:4px;flex:none;border:1px solid #0006}
.lrow .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ty{color:var(--dim);font-size:10.5px}
.lrow.hid .nm{opacity:.45}
.eye{width:22px;text-align:center;color:var(--dim)}
.addmenu{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:8px}
.addmenu button{font-size:11.5px;padding:5px 6px}
.lacts{display:flex;gap:4px;margin-top:6px}
.lacts button{flex:1;font-size:11px;padding:4px}
/* controls */
details.sec{border-bottom:1px solid var(--line);padding:2px 12px 8px}
details.sec>summary{list-style:none;cursor:pointer;padding:8px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);user-select:none}
details.sec>summary::before{content:'▸ ';display:inline-block;width:12px}
details.sec[open]>summary::before{content:'▾ '}
.row{display:grid;grid-template-columns:92px 1fr 54px;align-items:center;gap:6px;margin:5px 0}
.row label{color:#c9c6d6;font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.wide{grid-template-columns:92px 1fr}
.row.full{grid-template-columns:1fr}
.row input[type=number]{width:54px;background:#121116;border:1px solid var(--line);border-radius:5px;padding:3px 4px;font-size:11px}
.row select,.row input[type=text],.row textarea{width:100%;background:#121116;border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.row textarea{resize:vertical;min-height:44px;font-family:var(--fcfont),FCNEO,system-ui;font-size:16px;letter-spacing:1px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:#3a3946}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#d9cffc;margin-top:-4.5px;border:2px solid #7d4ff0}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#3a3946}
input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#d9cffc;border:2px solid #7d4ff0}
input[type=color]{-webkit-appearance:none;width:100%;height:24px;border:1px solid var(--line);border-radius:5px;padding:0;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:2px}input[type=color]::-webkit-color-swatch{border:none;border-radius:3px}
.chk{display:flex;align-items:center;gap:6px}
.btnrow{display:flex;flex-wrap:wrap;gap:4px;grid-column:1/-1}
.btnrow button{font-size:11px;padding:4px 7px}
.note{color:var(--dim);font-size:11px;margin:4px 0 2px;grid-column:1/-1}
/* palette */
.pal{grid-column:1/-1}
.pal .bar{position:relative;height:26px;border-radius:5px;overflow:hidden;cursor:copy;
  background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.pal canvas{width:100%;height:100%;display:block}
.pal .stops{position:relative;height:16px;margin:0 0 4px}
.pal .stop{position:absolute;top:1px;width:12px;height:14px;margin-left:-6px;border:2px solid #fff;border-radius:3px 3px 6px 6px;cursor:ew-resize;box-shadow:0 1px 3px #0008}
.pal .stop.sel{border-color:var(--acc);transform:scale(1.15)}
.pal .ed{display:grid;grid-template-columns:44px 1fr 50px 26px;gap:5px;align-items:center}
.pal .ed input[type=number]{width:50px}
.pal .tools{display:flex;gap:4px;margin-top:6px}
.pal .tools select{flex:1;min-width:0;font-size:11px}
.pal .tools button{font-size:11px;padding:3px 6px}
#props .head{padding:10px 12px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#props .head input{flex:1;background:#121116;border:1px solid var(--line);border-radius:5px;padding:5px 7px;font-weight:600}
#props .head .tag{font-size:10.5px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
#props .empty{padding:20px;color:var(--dim)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;background:#2c2638;border:1px solid var(--acc);padding:8px 14px;border-radius:8px;transition:.25s;pointer-events:none;z-index:9}
#toast.on{opacity:1;transform:translateX(-50%)}
#toolbar{position:absolute;top:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;align-items:center;background:#1c1b22f0;border:1px solid var(--line);border-radius:10px;padding:5px 8px;z-index:3;white-space:nowrap}
#toolbar.on{display:flex}
#toolbar button{padding:5px 9px}
#toolbar button.act{background:#3a2c58;border-color:var(--acc);color:#fff}
#toolbar label{display:flex;align-items:center;gap:5px;color:#c9c6d6}
#toolbar input[type=range]{width:110px}
#toolbar input[type=number]{width:48px;background:#121116;border:1px solid var(--line);border-radius:5px;padding:3px 4px}
#toolbar .sep{width:1px;height:20px;background:var(--line);margin:0 2px}
#cur{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.zone{border:1px solid var(--line);border-radius:7px;padding:4px 8px;margin:6px 0;background:#19181e}
.zone .zh{display:flex;justify-content:space-between;align-items:center;color:#6dffc0;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
.shapegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;grid-column:1/-1}
.shapegrid button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 2px;font-size:10.5px;line-height:1.1}
.shapegrid button b{font-size:17px;font-weight:400;color:#d9cffc}
button.hot{background:linear-gradient(180deg,#3d2d5c,#2e2445);border-color:#7d4ff0}
#glyphPanel{position:absolute;left:62px;top:10px;bottom:10px;width:360px;display:none;flex-direction:column;background:#1c1b22f7;border:1px solid var(--line);border-radius:10px;z-index:5;box-shadow:0 10px 40px #0008}
#glyphPanel.on{display:flex}
#glyphPanel .gph{display:flex;align-items:center;gap:6px;padding:9px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#glyphPanel .gph b{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin-right:auto}
#glyphPanel .slot.act{background:#3a2c58;border-color:var(--acc);color:#fff}
#gpGrid{overflow-y:auto;padding:6px 10px 12px}
#gpGrid h4{margin:10px 0 5px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);font-weight:600}
#gpGrid .cells{display:grid;grid-template-columns:repeat(6,1fr);gap:4px}
#gpGrid .cell{display:flex;flex-direction:column;align-items:center;padding:4px 0 2px;border-radius:6px;background:var(--panel2);border:1px solid transparent;cursor:pointer}
#gpGrid .cell:hover{border-color:#5a5868}
#gpGrid .cell.on{border-color:var(--acc);background:#2c2638}
#gpGrid .cell span{font-family:var(--fcfont),FCNEO;font-size:30px;line-height:36px;color:#fff}
#gpGrid .cell small{font-size:9px;color:var(--dim);max-width:52px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#glyphPanel .gpnote{padding:6px 10px 0;color:var(--dim);font-size:11px}
#busy{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:8;font-size:14px}
#busy.on{display:flex}
#busy div{background:var(--panel);border:1px solid var(--line);padding:16px 22px;border-radius:10px}

/* ===== Dream Theater UI ===== */
#menubar{height:34px;display:flex;align-items:center;gap:6px;padding:0 10px;background:#121116;border-bottom:1px solid var(--line);position:relative;z-index:30}
#menubar .brand{margin-right:6px}
#menubar .brand .logo{font-size:17px}
#menubar .brand small{font-size:11px}
#menus{display:flex;gap:1px}
.mlabel{padding:4px 9px;border-radius:5px;cursor:default;color:#d6d3e2;font-size:12.5px;user-select:none}
.mlabel:hover,.mlabel.open{background:#2b2a35}
.ibtn{background:transparent;border:1px solid transparent;border-radius:6px;padding:3px 7px;color:#cfcbe0;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:12px}
.ibtn:hover{background:#2b2a35;border-color:#3d3b4a}
.ibtn svg{width:16px;height:16px}
.hsep{width:1px;height:18px;background:var(--line);margin:0 4px}
button.sm{padding:4px 10px;font-size:12px}
#menubar select{height:26px;font-size:12px}
.menu{position:fixed;z-index:80;background:#22212a;border:1px solid #44425a;border-radius:8px;padding:4px;min-width:230px;box-shadow:0 12px 34px #000b;display:none}
.menu.on{display:block}
.menu .mi{display:grid;grid-template-columns:16px 1fr auto;gap:8px;align-items:center;padding:5px 10px 5px 6px;border-radius:5px;font-size:12.5px;color:#e6e3ef;cursor:default;white-space:nowrap}
.menu .mi:hover{background:#3a2c58}
.menu .mi.dis{opacity:.4;pointer-events:none}
.menu .mi .k{color:var(--dim);font-size:11px;padding-left:16px}
.menu .msep{height:1px;background:var(--line);margin:4px 6px}
.menu .mh{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);padding:5px 10px 3px}
main{height:calc(100% - 34px)!important}
#center{flex:1;display:flex;flex-direction:column;min-width:0}
#optbar{height:44px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid var(--line);background:#19181f;overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
#optbar::-webkit-scrollbar{display:none}
#optbar>*{flex:none}
@media(max-width:1350px){#optbar .ltype{display:none}}
#optbar .lname{width:150px;background:#121116;border:1px solid var(--line);border-radius:6px;padding:5px 8px;font-weight:600;font-size:12.5px}
#optbar .ltype{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);white-space:nowrap}
#optbar .osep{width:1px;height:22px;background:var(--line)}
#optbar .oicon{display:flex;color:#d9cffc}
#optbar .oicon svg{width:20px;height:20px}
#optbar .ogrp{display:flex;align-items:center;gap:2px}
#stage{flex:1}
aside#left{width:268px}
aside#right{width:304px;display:flex;flex-direction:column}
#rtop{display:flex;flex-direction:column;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
#rtop select{width:100%;height:28px}
.licons{display:flex;justify-content:space-between}
.licons .ibtn{padding:5px 9px}
.licons .ibtn svg{width:18px;height:18px}
.phead{padding:9px 12px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);font-weight:600}
#layerList{padding:0 10px 10px;max-height:34%;overflow-y:auto;flex:none}
.lrow{padding:6px 8px;border-radius:7px}
.lrow .nm{font-size:12.5px}
#props{flex:1;overflow-y:auto;border-top:1px solid var(--line)}
#props .head{display:none}
.shprev{display:block;width:100%;height:auto;border-radius:6px;background-color:#fff;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
.psub{font-size:10.5px;color:var(--dim);margin:-2px 0 6px;text-transform:none;letter-spacing:0}
/* compact controls */
.ctl details.sec{padding:0 12px 6px}
.ctl details.sec>summary{padding:9px 0 5px;font-size:10.5px;font-weight:600;letter-spacing:.1em}
.ctl .row{grid-template-columns:1fr 96px;gap:8px;margin:3px 0;min-height:24px}
.ctl .row.wide{grid-template-columns:1fr 150px}
.ctl .row.full{grid-template-columns:1fr}
.ctl .row label{font-size:11.5px;color:#bdb9cc}
.ctl .row label.scrub{cursor:ew-resize}
.nf{display:flex;align-items:center;background:#121116;border:1px solid var(--line);border-radius:5px;height:24px;overflow:hidden}
.nf:focus-within{border-color:#6b56b0}
.nf input{flex:1;min-width:0;width:100%!important;background:transparent!important;border:0!important;padding:0 6px!important;font-size:11.5px;color:#e9e7f0;-moz-appearance:textfield;height:22px}
.nf input::-webkit-inner-spin-button,.nf input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.nf .dd{border:0;background:transparent;padding:0 6px;height:22px;color:var(--dim);border-left:1px solid var(--line);border-radius:0;font-size:10px}
.nf .dd:hover{color:#fff;background:#2b2a35}
.ctl .row select{height:24px;padding:2px 6px;font-size:11.5px}
.ctl .row input[type=color]{width:44px;height:22px;justify-self:end}
.ctl .tr{display:flex;justify-content:flex-end}
.tog{position:relative;width:30px;height:17px;display:inline-block;flex:none}
.tog input{opacity:0;width:0;height:0;position:absolute}
.tog span{position:absolute;inset:0;background:#3a3946;border-radius:9px;transition:.15s;cursor:pointer}
.tog span::after{content:'';position:absolute;left:2px;top:2px;width:13px;height:13px;border-radius:50%;background:#d9d6e6;transition:.15s}
.tog input:checked+span{background:#7d4ff0}
.tog input:checked+span::after{left:15px}
.ctl.inline{display:flex;align-items:center;gap:12px;flex-wrap:nowrap}
.ctl.inline .row{display:flex;align-items:center;gap:6px;margin:0;min-height:0}
.ctl.inline .row label{white-space:nowrap;font-size:11.5px}
.ctl.inline .nf{width:64px}
.nf .u{color:var(--dim);font-size:10px;padding-right:5px}
.ctl.inline .row select{width:auto}
#sliderPop{position:fixed;z-index:90;background:#22212a;border:1px solid #44425a;border-radius:9px;padding:8px 11px 6px;width:210px;box-shadow:0 12px 30px #000b;display:none}
#sliderPop.on{display:block}
#sliderPop .pt{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-bottom:2px}
#sliderPop .pt b{color:#fff;font-weight:600}
/* gradient editor */
.gedit{grid-column:1/-1;margin:2px 0 4px}
.gedit .gl{font-size:9.5px;letter-spacing:.09em;color:var(--dim);margin:6px 0 3px;display:flex;justify-content:space-between;align-items:center}
.gedit .gbar{position:relative;height:22px;border-radius:5px;overflow:hidden;cursor:copy;background-color:#fff;background-image:linear-gradient(45deg,#ccc 25%,transparent 25%),linear-gradient(-45deg,#ccc 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ccc 75%),linear-gradient(-45deg,transparent 75%,#ccc 75%);background-size:10px 10px;background-position:0 0,0 5px,5px -5px,-5px 0}
.gedit canvas{width:100%;height:100%;display:block}
.gedit .gst{position:relative;height:15px}
.gedit .gs{position:absolute;top:1px;width:11px;height:13px;margin-left:-5.5px;border:2px solid #fff;border-radius:2px 2px 6px 6px;cursor:ew-resize;box-shadow:0 1px 3px #0009}
.gedit .gs.sel{border-color:#b48cff;transform:scale(1.18)}
.gedit .gtools{display:flex;gap:4px;margin-top:6px;align-items:center}
.gedit .gtools select{flex:1;min-width:0;height:24px;font-size:11px}
.gedit .gtools .ibtn{padding:3px 6px;font-size:12px}
.gedit .ged{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--dim)}
.gedit .ged input[type=color]{width:34px;height:20px}
.gedit .ged .nf{width:64px;height:20px}
/* shape strip */
#shapes{position:absolute;right:10px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:2px;background:#1c1b22f2;border:1px solid var(--line);border-radius:10px;padding:5px;z-index:6}
#shapes button{width:40px;height:38px;padding:5px;background:transparent;border:1px solid transparent;border-radius:7px;color:#d7cff9;display:flex;align-items:center;justify-content:center}
#shapes button:hover{background:#3a2c58;border-color:#7d4ff0;color:#fff}
#shapes button svg{width:26px;height:26px}
#shapes .ssep{height:1px;background:var(--line);margin:3px 4px}
/* help */
#helpBox{position:fixed;inset:0;background:#0009;z-index:95;display:none;align-items:center;justify-content:center}
#helpBox.on{display:flex}
#helpBox .hb{background:#1f1e26;border:1px solid #44425a;border-radius:12px;padding:18px 22px;width:560px;max-height:80vh;overflow:auto;columns:2;column-gap:28px;font-size:12px}
#helpBox h4{margin:10px 0 4px;color:#d9cffc;font-size:11px;letter-spacing:.08em;text-transform:uppercase;break-after:avoid}
#helpBox .hr{display:flex;justify-content:space-between;gap:10px;padding:2px 0;break-inside:avoid}
/* stroke colour */
.tone .seg{display:flex;background:#121116;border:1px solid var(--line);border-radius:6px;padding:2px;gap:2px}
.tone .seg button{flex:1;border:0;background:transparent;padding:4px 6px;font-size:11px;color:var(--dim);border-radius:4px}
.tone .seg button.on{background:#3a2c58;color:#fff}
.tone .swrow{display:flex;gap:4px;flex-wrap:wrap;margin-top:7px;align-items:center}
.tone .swb{width:22px;height:22px;padding:0;border:2px solid #0007;border-radius:5px;position:relative;display:inline-flex;align-items:center;justify-content:center;font-size:13px;color:#ddd;cursor:pointer}
.tone .swb.on{border-color:#fff;box-shadow:0 0 0 1px #7d4ff0}
.tone .swb.add{background:#2b2a35;border-color:#4a475c}
.tone .swb.add input{position:absolute;opacity:0;width:100%;height:100%;cursor:pointer;left:0;top:0}
.tone .swb.wide{width:auto;padding:0 7px;font-size:10.5px;background:#2b2a35;border-color:#4a475c}
.tone .swsep{width:1px;height:16px;background:var(--line);margin:0 2px}
.ochip{width:34px;height:22px;border-radius:5px;border:2px solid #0008;box-shadow:0 0 0 1px #4a475c;cursor:pointer;padding:0}
/* compact extras */
.ctl .btnrow{gap:4px;flex-wrap:wrap}
.ctl .btnrow button{padding:3px 8px;font-size:11px}
.panel .ctl details.sec{padding:0;border-bottom:0}
.panel{padding:9px 12px}
#props .empty{padding:16px;color:var(--dim)}
#popPanel .ctl details.sec{border-bottom:1px solid var(--line)}
#helpBox kbd{font:11px ui-monospace,Menlo,monospace;color:var(--dim)}

</head>
<body>
<header id="menubar">
  <div class="brand"><span class="logo">Dream Theater</span><small>Dreamtonics Pattern Studio</small></div>
  <nav id="menus"></nav>
  <span class="spacer"></span>
  <select id="presetSel" title="Style"></select>
  <button id="rndBtn" class="ibtn" title="New random design in this style (R)"><svg viewBox="0 0 20 20"><path d="M4 10a6 6 0 0110.4-4M16 10a6 6 0 01-10.4 4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M14.6 2.6v3.6H11M5.4 17.4v-3.6H9" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>Random</button>
  <span class="hsep"></span>
  <button id="undoBtn" class="ibtn" title="Undo (⌘Z)"><svg viewBox="0 0 20 20"><path d="M7 5L3 9l4 4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 9H12a5 5 0 010 10H9" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <button id="redoBtn" class="ibtn" title="Redo (⇧⌘Z)"><svg viewBox="0 0 20 20"><path d="M13 5l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M16.5 9H8a5 5 0 000 10h3" fill="none" stroke="currentColor" stroke-width="1.8"/></svg></button>
  <span class="hsep"></span>
  <button class="primary sm" id="expBg" title="Export the background as a full-size PNG (⇧⌘E)">Export BG</button>
  <button class="primary sm" id="expTxt" title="Export the lettering as a transparent PNG (⌘E)">Export lettering</button>
  <button id="saveBtn" hidden></button><input type="file" id="loadIn" accept=".json,application/json" hidden>
</header>
<main>
  <aside id="left">
    <section class="panel" id="textPanel"><h3>Lettering</h3></section>
    <section class="panel" id="docPanel"><h3>Canvas &amp; export</h3></section>
    <section class="panel" id="refPanel"><h3>Reference image</h3></section>
  </aside>
  <div id="center">
    <div id="optbar"></div>
    <div id="stage">
      <div id="toolbar" style="display:none">
        <label class="opt-brush"><input type="range" id="tbSize" min="0.005" max="0.5" step="0.001"></label>
        <label class="opt-pen"><input type="checkbox" id="tbFill"></label>
        <label class="opt-draw"><input type="checkbox" id="tbBehind"></label>
        <label class="opt-draw"><input type="number" id="tbEcho"></label><span id="tbHint"></span>
      </div>
      <div id="tools"></div>
      <div id="shapes"></div>
      <div id="flyout"></div>
      <div id="zoomBar">
        <button id="zOut" title="Zoom out (⌘−)">−</button><span id="zPct">100%</span><button id="zIn" title="Zoom in (⌘+)">＋</button>
        <button id="zFit" title="Fit to window (⌘0)">Fit</button><button id="z100" title="Actual pixels (⌘1)">1:1</button>
      </div>
      <div id="glyphPanel">
        <div class="gph"><b>Glyphs</b>
          <button class="slot" data-slot="1">1st letter</button><button class="slot" data-slot="2">2nd letter</button>
          <button class="ghost" id="gpClose" title="Close">✕</button></div>
        <div class="gpnote" id="gpNote"></div>
        <div id="gpGrid"></div>
      </div>
      <div id="frame"><canvas id="view"></canvas><svg id="ov"></svg><svg id="cur"></svg></div>
    </div>
  </div>
  <aside id="right">
    <div id="rtop">
      <select id="tbShape" title="Drop in a ready-made shape you can then edit"><option value="">＋ Add shape…</option></select>
      <div class="licons">
        <button id="lUp" class="ibtn" title="Move layer up"><svg viewBox="0 0 20 20"><path d="M10 4l7 12H3z" fill="currentColor"/></svg></button>
        <button id="lDown" class="ibtn" title="Move layer down"><svg viewBox="0 0 20 20"><path d="M10 16L3 4h14z" fill="currentColor"/></svg></button>
        <button id="lDup" class="ibtn" title="Duplicate layer (⌘D)"><svg viewBox="0 0 20 20"><rect x="3" y="3" width="10" height="10" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.6"/><rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/></svg></button>
        <button id="lDel" class="ibtn" title="Delete layer"><svg viewBox="0 0 20 20"><path d="M4 6h12M8 6V4h4v2M6 6l1 11h6l1-11" fill="none" stroke="currentColor" stroke-width="1.6"/></svg></button>
        <button id="lAdd" class="ibtn" title="New layer"><svg viewBox="0 0 20 20"><path d="M10 2l8 8-8 8-8-8z" fill="currentColor"/><path d="M10 6.5v7M6.5 10h7" stroke="#1c1b22" stroke-width="2"/></svg></button>
      </div>
    </div>
    <div class="phead">Layers</div>
    <div id="layerList"></div>
    <div id="props"></div>
  </aside>
</main>
<div id="helpBox"><div class="hb" id="helpInner"></div></div>
<div id="toast"></div>
<input type="file" id="fontFile" accept=".otf,.ttf,.woff,.woff2,font/otf,font/ttf" hidden>
<div id="busy"><div id="busyTxt">Rendering…</div></div>

const STYLE_OF={'Camila · gradient strokes':'gradient','Wei Shu · colour-block bands':'blocks','YiXi / Ritchy · rap swirls':'rap','Ling Wan · outlined bands':'outlined'};
function randomDesign(){
  const style=STYLE_OF[state.style]; if(!style){ toast('Pick a style in the dropdown first'); return; }
  const rnd=mulberry((Math.random()*1e9)|0), rr=(a,b)=>a+(b-a)*rnd(), pick=a=>a[Math.floor(rnd()*a.length)], chance=p=>rnd()<p;

  let cols, layers=[], bg, label='';
  if(style==='rap'){
    cols=randomPalette(rnd, chance(0.6)?2:3);
    const base=chance(0.5)?cols[0]:cols[cols.length-1]; const others=cols.filter(c=>c!==base);
    const pal=[{c:base,a:1,p:0}, ...others.map((c,i)=>({c,a:1,p:(i+1)/others.length}))];
    const kindR=rnd(); let strokes= calliStrokes(rnd,pal,{n:Math.floor(rr(5,12)), w:rr(0.028,0.055), loopy:rr(0.3,1)});
    if(kindR>0.8) strokes=[...rapShapes(rnd,pal,{n:Math.floor(rr(3,7)), thick:rr(0.04,0.09)}), ...strokes];
    layers=[BR({name:'Seafoam swirls', pal, tip:'linear', goo:rr(0.004,0.013), gooTh:rr(0.4,0.55), strokes})]; bg=base; label='Rap swirls';
  } else {
    const nCol = style==='gradient'?Math.floor(rr(2,4)) : style==='blocks'?Math.floor(rr(3,6)) : Math.floor(rr(3,5));
    cols=randomPalette(rnd,nCol); const rev=chance(0.5); if(rev) cols.reverse();
    const pal=palFrom(cols);
    const lay=BR({name: style==='gradient'?'Gradient strokes':style==='blocks'?'Colour bands':'Outlined bands', pal, ok:chance(0.7)});
    lay.tip = style==='outlined'?pick(['linear','round']) : pick(['linear','linear','soft','round']);
    lay.tipCurve = rr(0.45,1.3); lay.tipCore = style==='blocks'?rr(0.45,0.8):(chance(0.25)?rr(0.1,0.4):0);
    if(style==='outlined' || chance(0.12)){ lay.lineW=rr(0.0012,0.0042); const dk=hex2rgb(cols.slice().sort((x,y)=>hexLum(x)-hexLum(y))[0]); lay.lineCol=rgb2hex(dk[0]*0.6,dk[1]*0.6,dk[2]*0.6); lay.lineA=rr(0.7,1); }

      const w = style==='blocks'?rr(0.08,0.2) : style==='outlined'?rr(0.05,0.13) : rr(0.08,0.28);
      const st=genFamily(rnd,kind,{w, sp:rr(0.42,0.62), cover:f===0?1.8:rr(0.3,1.2), maxN:f===0?30:12});
      if(f>0 && kind!=='fan' && st.echoN>14) st.echoN=Math.floor(rr(3,14));
      st.echoOrder = chance(0.25)?'under':'over';
      if(style==='blocks'){ const lo=rr(0,0.85); st.lo=lo; st.hi=clamp(lo+rr(0.06,0.2),0,1); st.echoTone=rr(0.15,0.45)*(chance(0.5)?1:-1); st.echoRand=rr(0.15,0.65); }
      else if(style==='outlined'){ st.lo=rr(0,0.25); st.hi=rr(0.55,1); if(chance(0.3)){ st.echoTone=rr(0.05,0.2); } }
      else { if(chance(0.3)){ st.lo=rr(0,0.3); st.hi=rr(0.7,1); } if(chance(0.15)) st.inv=true; }

    if(style==='blocks'){ const nA=Math.floor(rr(0,5)); for(let i=0;i<nA;i++){ const x=rr(0.05,0.95), y=rr(0.2,0.9), a=rr(0,360)*deg, L=rr(0.25,0.6);

    if(style==='outlined' && chance(0.7)){ const nP=Math.floor(rr(1,4)); for(let i=0;i<nP;i++){ const x=-0.3, y=rr(0.1,0.95), a=rr(-30,30)*deg;
      lay.strokes.splice(Math.floor(rr(1,lay.strokes.length)),0, ST([[x,y],[x+Math.cos(a)*0.8,y+Math.sin(a)*0.8],[x+Math.cos(a)*1.6,y+Math.sin(a)*1.6]],{w:rr(0.04,0.12),lo:rr(0.8,1),hi:1})); } }
    const nZ = style==='gradient'?Math.floor(rr(0,3)) : (chance(0.2)?1:0);

  }
  state.layers=layers; state.doc.bg=bg; state.doc.transparent=false; cache.clear(); state.sel=layers[0].id; state.selStroke=null; finishCurve(true); refreshAll(); commit();
  toast('Random '+state.style.split(' · ')[0]+' design');
}

{ const nav=$('#menus'); for(const name of Object.keys(MENUS)){ const lb=el('span',{class:'mlabel'},name);

<script id="dt-mobile-js">
(function(){
  const Q=s=>document.querySelector(s), B=document.body;
  const mb=Q('#menubar');
  const bl=document.createElement('button'); bl.id='mLeft'; bl.className='ibtn'; bl.textContent='\u2630'; bl.title='Lettering / Canvas';
  const br=document.createElement('button'); br.id='mRight'; br.className='ibtn'; br.textContent='Layers'; br.title='Layers / Properties';
  mb.insertBefore(bl, mb.firstChild); mb.appendChild(br);
  const sc=document.createElement('div'); sc.id='dtScrim'; B.appendChild(sc);
  const close=()=>B.classList.remove('dt-L','dt-R');
  const open=c=>{ const was=B.classList.contains(c); close(); if(!was) B.classList.add(c); };
  bl.onclick=()=>open('dt-L'); br.onclick=()=>open('dt-R'); sc.onclick=close;
  window.__dtBack=()=>{ if(B.classList.contains('dt-L')||B.classList.contains('dt-R')){ close(); return true; } return false; };

  /* pinch zoom + two-finger pan */
  const st=Q('#stage'); let g=null;
  const dist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
  st.addEventListener('touchstart',e=>{ if(e.touches.length===2){ e.preventDefault(); e.stopPropagation();
    const a=e.touches[0],b=e.touches[1]; g={d:dist(a,b),cx:(a.clientX+b.clientX)/2,cy:(a.clientY+b.clientY)/2};
    try{ Q('#ov').dispatchEvent(new PointerEvent('pointercancel',{bubbles:true})); }catch(_){} } },{capture:true,passive:false});
  st.addEventListener('touchmove',e=>{ if(g&&e.touches.length===2){ e.preventDefault(); e.stopPropagation();
    const a=e.touches[0],b=e.touches[1], nd=dist(a,b), cx=(a.clientX+b.clientX)/2, cy=(a.clientY+b.clientY)/2;
    vw.px+=cx-g.cx; vw.py+=cy-g.cy;
    if(nd>0&&g.d>0) zoomTo(vw.z*nd/g.d,cx,cy); else { layoutStage(true); drawOverlay(); }
    g.d=nd; g.cx=cx; g.cy=cy; } },{capture:true,passive:false});
  const end=e=>{ if(e.touches.length<2) g=null; };
  st.addEventListener('touchend',end,true); st.addEventListener('touchcancel',end,true);

  /* downloads -> Android bridge (Downloads/DreamTheater) */
  if(window.AndroidBridge){
    window.saveFile=async function(name,blob){
      try{
        const buf=new Uint8Array(await blob.arrayBuffer());
        AndroidBridge.open(name, blob.type||'application/octet-stream');
        const CH=3*256*1024;
        for(let i=0;i<buf.length;i+=CH){
          const part=buf.subarray(i,i+CH); let s='';
          for(let j=0;j<part.length;j+=0x8000) s+=String.fromCharCode.apply(null,part.subarray(j,j+0x8000));
          AndroidBridge.write(btoa(s)); await new Promise(r=>setTimeout(r,0));
        }
        AndroidBridge.close(); toast('Saved '+name+' \u2192 Downloads/DreamTheater');
      }catch(err){ try{AndroidBridge.abort();}catch(_){} toast('Save failed: '+err.message); }
    };
  }
  setTimeout(()=>window.dispatchEvent(new Event('resize')),150);
  window.addEventListener('orientationchange',()=>setTimeout(()=>window.dispatchEvent(new Event('resize')),250));
})();
</script>
